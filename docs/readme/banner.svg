<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="VELA: Make room for more: card finishes, a savings planner and plans that add up.">
<title>VELA</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e140e"/><stop offset="1" stop-color="#1f2b1d"/></linearGradient>
<radialGradient id="glow" cx="0.78" cy="0.45" r="0.55"><stop offset="0" stop-color="#d8e35a" stop-opacity="0.42"/><stop offset="1" stop-color="#d8e35a" stop-opacity="0"/></radialGradient>
<linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#d8e35a" stop-opacity="0"/><stop offset="0.5" stop-color="#d8e35a" stop-opacity="0.18"/><stop offset="1" stop-color="#d8e35a" stop-opacity="0"/></linearGradient>
</defs>
<style>
.t{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:800;fill:#f4f6ea;letter-spacing:-0.01em;animation:rise 1.1s ease-out both}
.e{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:700;font-size:17px;letter-spacing:0.28em;fill:#d8e35a;animation:rise 0.9s ease-out both}
.g{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:24px;fill:#f4f6ea;opacity:0.82;animation:rise 1.3s ease-out 0.45s both}
.u{animation:grow 1.4s ease-out 0.6s both;transform-origin:72px 0}
.glow{animation:breathe 7s ease-in-out infinite;transform-origin:1000px 160px}
.p{animation:drift linear infinite}
.ring{transform-origin:1010px 180px;animation:spin linear infinite}
.wave{animation:slide linear infinite}
.scan{animation:sweep 6s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes drift{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-190px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{to{transform:translateX(-160px)}}
@keyframes sweep{to{transform:translateX(1520px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1280" height="360" fill="url(#bg)"/>
<rect class="glow" width="1280" height="360" fill="url(#glow)"/>
<circle class="ring" cx="1010" cy="180" r="70" fill="none" stroke="#d8e35a" stroke-width="2" stroke-dasharray="6 10" style="animation-duration:26s;animation-direction:normal"/><circle class="ring" cx="1010" cy="180" r="116" fill="none" stroke="#9fb08a" stroke-width="1.2" stroke-dasharray="11 14" style="animation-duration:38s;animation-direction:reverse"/><circle class="ring" cx="1010" cy="180" r="162" fill="none" stroke="#d8e35a" stroke-width="1.2" stroke-dasharray="16 18" style="animation-duration:50s;animation-direction:normal"/><circle class="ring" cx="1010" cy="180" r="208" fill="none" stroke="#9fb08a" stroke-width="1.2" stroke-dasharray="21 22" style="animation-duration:62s;animation-direction:reverse"/>
<text x="72" y="74.4" class="e">EVERYDAY BANKING · A FICTIONAL BRAND</text>
<text x="72" y="196" font-size="128" class="t" style="animation-delay:0.15s">VELA</text>
<rect class="u" x="72" y="218" width="520" height="3" fill="#d8e35a"/>
<text x="72" y="254" class="g">Make room for more: card finishes, a savings planner and plans that add up.</text>
</svg>
